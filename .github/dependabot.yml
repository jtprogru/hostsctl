version: 2
updates:
  # Экшены запинены по SHA, так что двигает их только это.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"

  - package-ecosystem: npm
    directory: "/docs"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
